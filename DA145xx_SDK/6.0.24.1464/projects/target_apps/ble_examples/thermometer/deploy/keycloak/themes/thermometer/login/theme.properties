# Reskins the stock login pages to match the web app's "Pine & Ember" design
# (fe/tailwind.config.js, fe/src/index.css) — CSS-only on top of Keycloak's
# own keycloak.v2 theme, no forked FreeMarker templates, so it keeps working
# across Keycloak version bumps instead of drifting from upstream markup.
parent=keycloak.v2
import=common/keycloak
styles=css/login.css

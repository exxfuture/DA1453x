# Mosquitto single node (architecture v3 §11: fine up to tens of thousands of
# connections; cluster to EMQX/VerneMQ only once that's actually the
# bottleneck). The same file serves the local stack (../../docker-compose.yml)
# and the hardened overlay (../../docker-compose.prod.yml).
#
# Authentication / authorisation: the built-in dynamic-security plugin.
# allow_anonymous is OFF on both listeners. The client/role database
# (/mosquitto/data/dynamic-security.json, on the mosquitto_data volume) is
# created on the container's first start by `mosquitto_ctrl dynsec init`
# (see the mosquitto service's command in docker-compose.yml) with one admin
# client, whose credentials the backend uses. The backend is the only
# provisioning authority from then on (backend/README.md "MQTT broker
# identities"): it creates the `collector` client the gateways use, its own
# publish role for the live feed, and a per-user client + role for every
# browser session that asks for one via POST /api/live/credentials. Nothing
# else can connect, publish or subscribe.
#
# TLS is terminated in front of the broker by the reverse proxy in
# docker-compose.prod.yml (WSS on the public hostname); the plain listeners
# below are reachable only inside the compose network and, for the local
# stack, on 127.0.0.1.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Local dev / demo config — Mosquitto single node (architecture v3 §11:
# fine up to tens of thousands of connections; cluster to EMQX/VerneMQ only
# once that's actually the bottleneck).
#
# allow_anonymous is intentionally on here, mirroring the backend's `local`
# Spring profile disabling auth: this is a local development posture, not
# the production one. Architecture v3 §8.2 calls for JWT-based auth via the
# broker's JWT-auth plugin (or mTLS) in production — not configured here.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

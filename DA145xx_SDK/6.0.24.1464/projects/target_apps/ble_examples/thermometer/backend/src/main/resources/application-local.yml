# Active by default (see spring.profiles.default in application.yml) — for
# running the backend on the host JVM (mvn spring-boot:run) against the
# infra containers started by ../docker-compose.yml, which publish their
# ports to localhost. Security is disabled so the API is curl-able while
# iterating without a running Keycloak.
spring:
  datasource:
    # 5433, not 5432: ../docker-compose.yml deliberately publishes Postgres on
    # 5433 ("5432 is commonly taken on dev machines") and binds it to
    # 127.0.0.1. Pointing this at 5432 would either fail to connect or, worse,
    # silently talk to an unrelated Postgres the developer already runs.
    url: jdbc:postgresql://localhost:5433/thermometer
    username: thermometer
    password: thermometer

thermometer:
  security:
    enabled: false
  device:
    # Fixed value on the local profile so the OTA endpoints stay curl-able
    # with `-H 'X-Device-Token: dev-collector-token'`. Unlike the rest of the
    # local profile, this check is NOT disabled with security.enabled=false —
    # it lives in the controller, not the filter chain, so local development
    # exercises the same code path production does.
    collector-token: dev-collector-token
  mqtt:
    # The compose broker, reached through its published (127.0.0.1-bound) port.
    # Credentials are NOT disabled on this profile — the broker requires them
    # regardless of thermometer.security.enabled, which only governs this
    # service's own HTTP chain. username/password/collector-password come from
    # application.yml's env-var defaults (admin / mqtt-admin-dev /
    # collector-dev), i.e. exactly what ../docker-compose.yml initialises the
    # dynamic-security plugin with.
    broker-url: ${THERMOMETER_MQTT_BROKER_URL:tcp://localhost:1883}
  cors:
    allowed-origins: http://localhost:5173

# Test broker config — deliberately the same posture as deploy/mosquitto/mosquitto.conf:
# no anonymous access, every identity created through the dynamic-security
# plugin. The integration tests therefore exercise the real authentication and
# ACL path rather than an open broker that only exists in the test suite.
#
# The plugin's initial state (the one admin client) is created by the container's
# command — see MosquittoDynsecContainer.
listener 1883
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

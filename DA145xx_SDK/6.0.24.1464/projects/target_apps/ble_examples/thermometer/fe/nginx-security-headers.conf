# Baseline security headers (review INF-09), installed at
# /etc/nginx/snippets/security-headers.conf and included by the server block and
# by every location that adds a header of its own — `add_header` is NOT
# inherited into a location that declares any add_header itself, so each one has
# to re-include this.
#
# `always` so the headers are present on error responses too. $csp is set in the
# server block of nginx.conf.template, where the per-deployment origins are
# substituted. HSTS is intentionally not here: it belongs on the
# TLS-terminating proxy in front of this container.
add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Web Bluetooth is the whole point of the Connect page, so `bluetooth` stays
# enabled for same-origin documents; everything the app does not use is off.
add_header Permissions-Policy "bluetooth=(self), accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
